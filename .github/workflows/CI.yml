name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12']
        os: [ubuntu-latest]
        arch: [x64]
    steps:
      - uses: actions/checkout@v4
      # MeTTaCore's Manifest path-dep closure = MORK, PathMap, MorkSupercompiler, and
      # (transitively, via MorkSupercompiler) HPC + MORKTensorNetworks. Clone ALL of them as
      # siblings before instantiation. AdaptiveCompression is a url-source (Pkg fetches it);
      # MPI/Random are registered. NOTE: MorkSupercompiler (repo "Supercompiler") and HPC are
      # ⭐ MorkSupercompiler HAS MIGRATED (repointed 2026-08-21), per this note's own
      # instruction. Its live remote is `CognitiveSubstratesAI/MorkSupercompiler` — READ FROM
      # THE REMOTE, not assumed. The rename changed BOTH owner AND repo name (it was
      # `Supercompiler`), so a redirect may or may not have covered it: exactly the silent CI
      # breakage a stale clone URL produces. HPC is STILL on sivaji1012.
      - name: Clone path [sources] dependencies as siblings
        run: |
          git clone --depth 1 https://github.com/CognitiveSubstratesAI/PathMap.git ../PathMap
          git clone --depth 1 https://github.com/CognitiveSubstratesAI/MORK.git ../MORK
          git clone --depth 1 https://github.com/CognitiveSubstratesAI/MORKTensorNetworks.git ../MORKTensorNetworks
          git clone --depth 1 https://github.com/CognitiveSubstratesAI/MorkSupercompiler.git ../MorkSupercompiler
          git clone --depth 1 https://github.com/sivaji1012/HPC.git ../HPC
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  # NOTE: a JET static-analysis job was tried here (install JET in-job, run report_package) but
  # JET currently FAILS TO PRECOMPILE on Julia 1.12 (MethodError: add_active_gotos! — JET tracks
  # compiler internals and lags new Julia releases). Re-add a `jet` job when JET supports 1.12.
  # This is also why JET was dropped from [deps]: unused AND a latent precompile-breakage risk.

  format:
    name: Format (Blue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Check formatting
        run: |
          # 🔴 CORE HAD NO FORMAT GATE AT ALL until 2026-08-21 — the only package of twelve without
          # one, and consequently the most drifted: adding this required a 189-file reformat
          # (+11 069/-5 835), larger than MORK's 105. A config without a gate is a preference, not a
          # standard; .JuliaFormatter.toml has been here the whole time and nothing enforced it.
          # KEEP 2.12.6 IN LOCKSTEP with the global @v1.12 env: workflows/agent_check.jl parses this
          # line and REFUSES to run the formatter on a mismatch, because a mismatched formatter
          # MANUFACTURES diffs instead of catching drift (measured: 105 files of pure churn).
          julia -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaFormatter", version="2.12.6"))'
          julia -e 'using JuliaFormatter; println("JuliaFormatter ", pkgversion(JuliaFormatter))'
          julia -e 'using JuliaFormatter; format(".")'
          if ! git diff --quiet; then
            echo "::error::Formatting check failed — files below are not Blue-formatted:"
            git --no-pager diff --stat
            exit 1
          fi
          echo "All files Blue-formatted."

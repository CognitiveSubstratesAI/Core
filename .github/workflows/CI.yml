name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12']
        os: [ubuntu-latest]
        arch: [x64]
    steps:
      - uses: actions/checkout@v4
      # MeTTaCore's Manifest path-dep closure = MORK, PathMap, MorkSupercompiler, and
      # (transitively, via MorkSupercompiler) HPC + MORKTensorNetworks. Clone ALL of them as
      # siblings before instantiation. AdaptiveCompression is a url-source (Pkg fetches it);
      # MPI/Random are registered. NOTE: MorkSupercompiler (repo "Supercompiler") and HPC are
      # ⭐ MorkSupercompiler HAS MIGRATED (repointed 2026-08-21), per this note's own
      # instruction. Its live remote is `CognitiveSubstratesAI/MorkSupercompiler` — READ FROM
      # THE REMOTE, not assumed. The rename changed BOTH owner AND repo name (it was
      # `Supercompiler`), so a redirect may or may not have covered it: exactly the silent CI
      # breakage a stale clone URL produces. HPC is STILL on sivaji1012.
      - name: Clone path [sources] dependencies as siblings
        run: |
          git clone --depth 1 https://github.com/CognitiveSubstratesAI/PathMap.git ../PathMap
          git clone --depth 1 https://github.com/CognitiveSubstratesAI/MORK.git ../MORK
          git clone --depth 1 https://github.com/CognitiveSubstratesAI/MORKTensorNetworks.git ../MORKTensorNetworks
          git clone --depth 1 https://github.com/CognitiveSubstratesAI/MorkSupercompiler.git ../MorkSupercompiler
          git clone --depth 1 https://github.com/sivaji1012/HPC.git ../HPC
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  # ── NO jet JOB HERE, AND THE OLD REASON GIVEN FOR THAT WAS WRONG ──────────────────────────────
  # This note used to read "JET currently FAILS TO PRECOMPILE on Julia 1.12 (MethodError:
  # add_active_gotos!)". 🔴 THAT IS FALSE as of 2026-08-22 and was re-measured both ways on
  # julia 1.12.7 before deleting it — note that `version: '1.12'` above is a RANGE that setup-julia
  # resolves to the newest 1.12.x, so "on Julia 1.12" never named a version anything was tested at:
  #     global env, JET 0.12.1 tracking git master   -> using JET OK in 1.1 s
  #     clean env, Pkg.add("JET") from the registry  -> resolves 0.12.1, using JET OK in 1.3 s
  # (`add_active_gotos!` is not even in Core.Compiler any more.) The registry row is the one that
  # matters, because an in-job `Pkg.add("JET")` gets the REGISTERED release, not our master pin.
  #
  # ── THE POLICY, which is the real reason JET is not in [deps] ─────────────────────────────────
  # ANALYSIS TOOLS LIVE IN THE GLOBAL @v1.12 ENV AND ARE NEVER PACKAGE DEPENDENCIES. JET · Aqua ·
  # JuliaFormatter · AllocCheck · BenchmarkTools · Cthulhu are installed once, shared by every
  # package, and reached with `Base.require(Main, :JET)` from workflows/agent_check.jl — which is
  # package-agnostic, so Core uses it exactly like the other eleven. VERIFIED UNIFORM 2026-08-22:
  # all twelve Project.tomls carry ZERO tool entries. Keeping JET out of [deps] is therefore correct
  # and stays; only the breakage rationale was wrong.
  #
  # ── WHY STILL NO CI JOB ───────────────────────────────────────────────────────────────────────
  # Not because JET cannot run, but because `report_package` is a FIREHOSE: 189 reports on MORK.
  # A gate nobody can get to zero is a gate everybody learns to ignore. The intended gate is the
  # RATCHETED `@report_opt` over a curated hot-path list in workflows/agent_check.jl (tier JET-HOT),
  # which reports NOT RUN until workflows/baselines/Core_jet.txt exists. Add the job when there is a
  # baseline to ratchet against — a count going UP — not a count being nonzero.

  format:
    name: Format (Blue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Check formatting
        run: |
          # 🔴 CORE HAD NO FORMAT GATE AT ALL until 2026-08-21 — the only package of twelve without
          # one, and consequently the most drifted: adding this required a 189-file reformat
          # (+11 069/-5 835), larger than MORK's 105. A config without a gate is a preference, not a
          # standard; .JuliaFormatter.toml has been here the whole time and nothing enforced it.
          # KEEP 2.12.6 IN LOCKSTEP with the global @v1.12 env: workflows/agent_check.jl parses this
          # line and REFUSES to run the formatter on a mismatch, because a mismatched formatter
          # MANUFACTURES diffs instead of catching drift (measured: 105 files of pure churn).
          julia -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaFormatter", version="2.12.6"))'
          julia -e 'using JuliaFormatter; println("JuliaFormatter ", pkgversion(JuliaFormatter))'
          julia -e 'using JuliaFormatter; format(".")'
          if ! git diff --quiet; then
            echo "::error::Formatting check failed — files below are not Blue-formatted:"
            git --no-pager diff --stat
            exit 1
          fi
          echo "All files Blue-formatted."

name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12']
        os: [ubuntu-latest]
        arch: [x64]
    steps:
      - uses: actions/checkout@v4
      # MeTTaCore's Manifest path-dep closure = MORK, PathMap, MorkSupercompiler, and
      # (transitively, via MorkSupercompiler) HPC + MORKTensorNetworks. Clone ALL of them as
      # siblings before instantiation. AdaptiveCompression is a url-source (Pkg fetches it);
      # MPI/Random are registered. NOTE: MorkSupercompiler (repo "Supercompiler") and HPC are
      # still on sivaji1012 — repoint to CognitiveSubstratesAI when they migrate.
      - name: Clone path [sources] dependencies as siblings
        run: |
          git clone --depth 1 https://github.com/CognitiveSubstratesAI/PathMap.git ../PathMap
          git clone --depth 1 https://github.com/CognitiveSubstratesAI/MORK.git ../MORK
          git clone --depth 1 https://github.com/CognitiveSubstratesAI/MORKTensorNetworks.git ../MORKTensorNetworks
          git clone --depth 1 https://github.com/sivaji1012/Supercompiler.git ../MorkSupercompiler
          git clone --depth 1 https://github.com/sivaji1012/HPC.git ../HPC
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  jet:
    # Static analysis via JET — runs the check that used to be done manually, WITHOUT carrying
    # JET as a runtime [dep] (it's installed in-job). Informational for now (continue-on-error);
    # flip `continue-on-error` to false to gate once the report is confirmed clean.
    name: JET static analysis (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Clone path [sources] dependencies as siblings
        run: |
          git clone --depth 1 https://github.com/CognitiveSubstratesAI/PathMap.git ../PathMap
          git clone --depth 1 https://github.com/CognitiveSubstratesAI/MORK.git ../MORK
          git clone --depth 1 https://github.com/CognitiveSubstratesAI/MORKTensorNetworks.git ../MORKTensorNetworks
          git clone --depth 1 https://github.com/sivaji1012/Supercompiler.git ../MorkSupercompiler
          git clone --depth 1 https://github.com/sivaji1012/HPC.git ../HPC
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
          arch: x64
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: JET report_package (in-job install, not a runtime dep)
        continue-on-error: true
        run: |
          julia --project=. -e '
            using Pkg; Pkg.add("JET")
            using JET, MeTTaCore
            show(JET.report_package(MeTTaCore)); println()
          '
